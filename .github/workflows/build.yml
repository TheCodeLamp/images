name: Build container images

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main]
    paths-ignore: ['**/README.md']
  workflow_dispatch:

env:
  IMAGE_NAME: "bootc"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push ${{ matrix.variant }} image
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        variant: [base, desktop, laptop]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set build env vars
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "TIMESTAMP=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build ${{ matrix.variant }} image
        run: |
          CACHE_PUSH="false"
          if [ "${{ github.event_name }}" != "pull_request" ]; then CACHE_PUSH="true"; fi
          ./build.sh "${{ matrix.variant }}" "${{ env.IMAGE_NAME }}" "${{ env.IMAGE_REGISTRY }}" $CACHE_PUSH "${{ env.TIMESTAMP }}"

      - name: Push ${{ matrix.variant }} image
        if: github.event_name != 'pull_request'
        run: |
          ./push.sh "${{ matrix.variant }}" "${{ env.IMAGE_NAME }}" "${{ env.IMAGE_REGISTRY }}" "${{ env.TIMESTAMP }}"
